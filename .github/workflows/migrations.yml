name: Migrations Control Plane

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Salvaguarda desta execução"
        required: true
        default: "backup_confirmado"
        type: choice
        options:
          - backup_confirmado
          - inicializacao_base_vazia
      confirmacao:
        description: "Digite APLICAR (backup) ou INICIALIZAR (base vazia)"
        required: true
        type: string
      salvaguarda_confirmada:
        description: "Confirmo o backup recuperável ou que a base não possui dados a preservar"
        required: true
        default: false
        type: boolean

concurrency:
  group: migrations-control-plane-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar-autorizacao:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir confirmação e salvaguarda
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
          MODO: ${{ inputs.modo }}
          SALVAGUARDA_CONFIRMADA: ${{ inputs.salvaguarda_confirmada }}
          GIT_REF_SELECIONADA: ${{ github.ref }}
        run: |
          if [ "$GIT_REF_SELECIONADA" != "refs/heads/main" ]; then
            echo "::error::Migrações de produção só podem ser executadas a partir de main"
            exit 1
          fi
          if [ "$SALVAGUARDA_CONFIRMADA" != "true" ]; then
            echo "::error::A salvaguarda da execução precisa ser confirmada"
            exit 1
          fi
          case "$MODO:$CONFIRMACAO" in
            backup_confirmado:APLICAR) ;;
            inicializacao_base_vazia:INICIALIZAR) ;;
            *) echo "::error::Confirmação incompatível com o modo selecionado"; exit 1 ;;
          esac

  migrar:
    needs: validar-autorizacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CONTROL_PLANE_DATABASE_URL: ${{ secrets.CONTROL_PLANE_DATABASE_URL }}
      MODO_MIGRACAO: ${{ inputs.modo }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validar segredo do banco
        run: |
          if [ -z "$CONTROL_PLANE_DATABASE_URL" ]; then
            echo "::error::Secret CONTROL_PLANE_DATABASE_URL ausente no ambiente production"
            exit 1
          fi
          case "$CONTROL_PLANE_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::CONTROL_PLANE_DATABASE_URL não é uma URL PostgreSQL"; exit 1 ;;
          esac

      - name: Instalar dependências reproduzíveis
        run: npm ci --include=dev

      - name: Validar schema
        run: npx prisma validate

      - name: Diagnóstico anterior
        id: status-anterior
        continue-on-error: true
        run: npx prisma migrate status

      - name: Aplicar migrações pendentes
        run: npx prisma migrate deploy

      - name: Confirmar estado final
        run: npx prisma migrate status

      - name: Registrar resumo
        env:
          STATUS_ANTERIOR: ${{ steps.status-anterior.outcome }}
        run: |
          {
            echo "## Migrações do Control Plane"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Modo: \`$MODO_MIGRACAO\`"
            echo "- Diagnóstico anterior: \`$STATUS_ANTERIOR\`"
            echo "- Aplicação: concluída"
            echo "- Estado final: sem migrações pendentes"
          } >> "$GITHUB_STEP_SUMMARY"
