name: Migrations Control Plane

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite APLICAR para confirmar"
        required: true
        type: string
      backup_confirmado:
        description: "Confirmo que há backup verificável antes da migração"
        required: true
        default: false
        type: boolean

concurrency:
  group: migrations-control-plane-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validar-autorizacao:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir confirmação e backup
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
          BACKUP_CONFIRMADO: ${{ inputs.backup_confirmado }}
          GIT_REF_SELECIONADA: ${{ github.ref }}
        run: |
          if [ "$GIT_REF_SELECIONADA" != "refs/heads/main" ]; then
            echo "::error::Migrações de produção só podem ser executadas a partir de main"
            exit 1
          fi
          if [ "$CONFIRMACAO" != "APLICAR" ]; then
            echo "::error::Confirmação inválida; digite APLICAR"
            exit 1
          fi
          if [ "$BACKUP_CONFIRMADO" != "true" ]; then
            echo "::error::O backup precisa ser confirmado"
            exit 1
          fi

  migrar:
    needs: validar-autorizacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CONTROL_PLANE_DATABASE_URL: ${{ secrets.CONTROL_PLANE_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validar segredo do banco
        run: |
          if [ -z "$CONTROL_PLANE_DATABASE_URL" ]; then
            echo "::error::Secret CONTROL_PLANE_DATABASE_URL ausente no ambiente production"
            exit 1
          fi
          case "$CONTROL_PLANE_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::CONTROL_PLANE_DATABASE_URL não é uma URL PostgreSQL"; exit 1 ;;
          esac

      - name: Instalar dependências reproduzíveis
        run: npm ci --include=dev

      - name: Validar schema
        run: npx prisma validate

      - name: Diagnóstico anterior
        id: status-anterior
        continue-on-error: true
        run: npx prisma migrate status

      - name: Aplicar migrações pendentes
        run: npx prisma migrate deploy

      - name: Confirmar estado final
        run: npx prisma migrate status

      - name: Registrar resumo
        env:
          STATUS_ANTERIOR: ${{ steps.status-anterior.outcome }}
        run: |
          {
            echo "## Migrações do Control Plane"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Diagnóstico anterior: \`$STATUS_ANTERIOR\`"
            echo "- Aplicação: concluída"
            echo "- Estado final: sem migrações pendentes"
          } >> "$GITHUB_STEP_SUMMARY"
