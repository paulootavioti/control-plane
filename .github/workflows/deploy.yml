name: Deploy Control Plane

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run test
      - run: npm run build:completo
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Conferir segredos do Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          faltando=""
          [ -z "$NETLIFY_AUTH_TOKEN" ] && faltando="$faltando NETLIFY_AUTH_TOKEN"
          [ -z "$NETLIFY_SITE_ID" ] && faltando="$faltando NETLIFY_SITE_ID"
          if [ -n "$faltando" ]; then
            echo "::error::Segredo(s) ausente(s):$faltando"
            exit 1
          fi
      - name: Publicar no Netlify
        # Versão exata: faixas do CLI já quebraram o deploy por dependência
        # publicada de forma inconsistente no registry.
        run: npx --yes netlify-cli@27.1.2 deploy --prod --dir=web/dist --functions=dist/netlify/functions --json > netlify-deploy.json
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - name: Resolver URL publicada
        run: |
          node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("netlify-deploy.json","utf8")); const u=d.url; if(typeof u!=="string" || !u.startsWith("https://")) process.exit(1); process.stdout.write(`CONTROL_PLANE_DEPLOY_URL=${u.replace(/\/$/, "")}\n`)' >> "$GITHUB_ENV"
      - name: Validar liveness e prontidão
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$CONTROL_PLANE_DEPLOY_URL/api/health"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$CONTROL_PLANE_DEPLOY_URL/api/ready"
